name: experience-transfer-lab

services:
  lab:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      APP_ORIGIN: "${APP_ORIGIN:-http://127.0.0.1:3000}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
      APP_SECRET: "${APP_SECRET:?Set APP_SECRET in .env}"
      MODEL_API_BASE_URL: "${MODEL_API_BASE_URL:-https://api.deepseek.com}"
      MODEL_NAME: "${MODEL_NAME:-deepseek-flash}"
    volumes:
      - lab-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  lab-data:
